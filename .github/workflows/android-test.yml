name: Android test APK
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scenes/**'
      - 'assets/**'
      - 'tests/**'
      - 'scripts/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-test
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.6.3 and official Android template
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable
          mkdir -p "$RUNNER_TEMP/godot" .runtime/data/godot/export_templates/4.6.3.stable
          curl -fL --retry 3 "$base/Godot_v4.6.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/engine.zip"
          curl -fL --retry 3 "$base/Godot_v4.6.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/godot/SHA512-SUMS.txt"
          cd "$RUNNER_TEMP/godot"
          mv engine.zip Godot_v4.6.3-stable_linux.x86_64.zip
          mv templates.tpz Godot_v4.6.3-stable_export_templates.tpz
          grep -E ' (Godot_v4.6.3-stable_linux.x86_64.zip|Godot_v4.6.3-stable_export_templates.tpz)$' SHA512-SUMS.txt > selected-checksums.txt
          test "$(wc -l < selected-checksums.txt)" -eq 2
          sha512sum -c selected-checksums.txt
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          ln -s "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -p Godot_v4.6.3-stable_export_templates.tpz templates/android_debug.apk > "$GITHUB_WORKSPACE/.runtime/data/godot/export_templates/4.6.3.stable/android_debug.apk"
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'build-tools;36.0.0'
      - name: Test game logic
        run: bash tests/check.sh
      - name: Export and verify signed debug APK
        env:
          ASTRAL_DEBUG_KEYSTORE: ${{ runner.temp }}/astral-debug.keystore
        run: bash scripts/build_android.sh
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Astral-Frontier-Android-test
          path: |
            build/astral-frontier-debug.apk
            build/astral-frontier-debug.apk.sha256
            build/apk-info.txt
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="test-${GITHUB_RUN_NUMBER}"
          printf '%s\n' 'ARM64 Android 7.0+ test APK. Godot 4.6.3. Debug signed; not tested on a physical phone. A fresh test signing key is generated for each build; uninstall older test builds if Android reports a signature conflict.' > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" build/astral-frontier-debug.apk build/astral-frontier-debug.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Astral Frontier 0.1.0 — test ${GITHUB_RUN_NUMBER}" --prerelease --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Save diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-logs
          if-no-files-found: ignore
          path: |
            .runtime/android-import.log
            .runtime/android-export.log
            .runtime/import.log
